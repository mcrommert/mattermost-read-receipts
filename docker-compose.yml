services:
  mm-read-receipts:
    build: .
    # Or use a prebuilt image once you publish one:
    # image: ghcr.io/mcrommert/mattermost-read-receipts:latest
    container_name: mm-read-receipts
    restart: unless-stopped
    environment:
      # Recommended: keep secrets out of config.yml.
      MM_URL: "https://mattermost.example.com"
      MM_TOKEN: "your-system-admin-token"
    volumes:
      - ./config.yml:/app/config.yml:ro
